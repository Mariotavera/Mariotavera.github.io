<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  
  <!-- Outer Walkability Buffer (Reduced Scale) -->
  <circle cx="400" cy="225" r="105" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.3"/>
  
  <!-- Mid Buffer -->
  <circle cx="400" cy="225" r="70" fill="#00a884" fill-opacity="0.12" stroke="#00a884" stroke-width="2" opacity="0.5"/>
  
  <!-- Inner High-Score Core -->
  <circle cx="400" cy="225" r="38" fill="#00a884" fill-opacity="0.35" stroke="#00a884" stroke-width="2.5"/>

  <!-- Center Public Space Node -->
  <circle cx="400" cy="225" r="6" fill="#00a884"/>

  <!-- Radial Distance Guides -->
  <line x1="220" y1="225" x2="580" y2="225" stroke="#00a884" stroke-width="1" opacity="0.2"/>
  <line x1="400" y1="80" x2="400" y2="370" stroke="#00a884" stroke-width="1" opacity="0.2"/>
</svg>
