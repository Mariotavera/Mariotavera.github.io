<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  
  <!-- Extended Street Network Grid Context -->
  <g stroke="#64748b" stroke-width="1" opacity="0.3">
    <line x1="80" y1="165" x2="720" y2="165"/>
    <line x1="80" y1="225" x2="720" y2="225"/>
    <line x1="80" y1="285" x2="720" y2="285"/>
    <line x1="220" y1="60" x2="220" y2="390"/>
    <line x1="280" y1="60" x2="280" y2="390"/>
    <line x1="340" y1="60" x2="340" y2="390"/>
    <line x1="400" y1="60" x2="400" y2="390"/>
    <line x1="460" y1="60" x2="460" y2="390"/>
    <line x1="520" y1="60" x2="520" y2="390"/>
    <line x1="580" y1="60" x2="580" y2="390"/>
  </g>

  <!-- Network Service Area Polygon (Scaled Down) -->
  <polygon points="400,165 460,225 400,285 340,225" fill="#00a884" fill-opacity="0.25" stroke="#00a884" stroke-width="2"/>

  <!-- Reached Core Network Segments -->
  <g stroke="#00a884" stroke-width="2">
    <line x1="340" y1="225" x2="460" y2="225"/>
    <line x1="400" y1="165" x2="400" y2="285"/>
  </g>

  <!-- Network Origin Node -->
  <circle cx="400" cy="225" r="5" fill="#00a884"/>
  <circle cx="400" cy="225" r="9" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
</svg>
