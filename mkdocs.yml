# ============================================================
# PORTFOLIO CONFIGURATION
# This file is in the YAML format and is very sensitive to 
# spaces. Ensure to match the indentation level and spacing
# of new items with existing ones

# Edit all lines marked [YOUR ...] to customize your site
# ============================================================

site_name: "Geospatial Portfolio"
site_description: "Portfolio of Mario Tavera — GIS, Remote Sensing, and Spatial Data Science"
site_author: "Mario Tavera"
# After your site is live, uncomment and set this to your actual GitHub Pages URL:
#site_url: "https://Mariotavera.github.io/your-repo-name"

theme:
  name: material
  # Icon used as both the site logo (header) and browser favicon.
  # Browse icons at https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/
  # and replace "material/earth" with any "material/..." icon name you prefer.
  icon:
    logo: material/earth
  palette:
    # To change the color, edit the 'primary' and 'accent' values below for both
    # the 'default' (light) and 'slate' (dark) schemes.
    # Available colors: red, pink, purple, deep purple, indigo, blue, light blue,
    # cyan, teal, green, light green, lime, yellow, amber, orange, deep orange
    - scheme: default            # Light mode
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate              # Dark mode
      primary: indigo
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs            # Top-level nav items shown as horizontal tabs
    - navigation.top             # Back-to-top button when scrolling up
    - content.code.copy          # Copy button on all code blocks
  font:
    text: Roboto
    code: Roboto Mono

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - md_in_html        # Allows Markdown inside HTML blocks
  - attr_list         # Allows adding CSS classes/widths: ![img](url){ width="70%" }
  - admonition        # Note/warning/tip boxes
  - tables            # Standard markdown tables
  - pymdownx.details  # Collapsible admonition blocks
  - pymdownx.superfences
  - pymdownx.tabbed:   # Enables tabs for carousels
      alternate_style: true
  - pymdownx.emoji:    # Inline icons
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


      

copyright: "Copyright &copy; [Mario Tavera] 2024. All rights reserved."

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Mariotavera
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/mario-tavera-palomino/
    - icon: material/email
      link: mailto:mariotaverapalomino@gmail.com


plugins:
  - search
  - meta
  - mkdocs-jupyter
  - glightbox

nav:
  - Home: index.md
  - Projects: 
      - "Back to Projects": projects/index.md
      - "Multi-Dimensional Urban Diagnosis & Strategic Planning": projects/project-1.md
      - "Automated Public Space Scoring for Action Plan Development": projects/project-2.md
      - "Localized Spatial Analytics Engine": projects/project-3.md
      - "Cloud-Native Satellite Image Analysis": projects/notebook-1.ipynb
  - Experience & Education: experience.md
  - Capacity Building: capacity-building.md
  - Institutional Reports & Research: publications.md
  - Contact: contact.md